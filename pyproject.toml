[tool.uv.workspace]
members = ["packages/core", "packages/langgraph", "packages/pydantic-dbos", "packages/pydantic-temporal"]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pyright>=1.1,<2",
    "ruff==0.17.4",
    "shellcheck-py==0.11.0.1",
]
docs = [
    "zensical==0.1.1",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["packages/*/src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "D101", "D102", "D103"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D101", "D102", "D103"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "--import-mode=importlib"

[tool.pyright]
include = ["packages/core/src", "packages/langgraph/src", "packages/pydantic-dbos/src", "packages/pydantic-temporal/src"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
