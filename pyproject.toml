[tool.uv.workspace]
members = ["core", "packages/langgraph", "packages/pydantic-dbos", "packages/pydantic-temporal"]

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "ruff==0.17.4",
    "shellcheck-py==0.11.0.1",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["core/src", "packages/*/src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "D101", "D102", "D103"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D101", "D102", "D103"]
