[project]
name = "dbos-report"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic-report", "pydantic-ai-slim[dbos]>=1,<3"]

[project.scripts]
dbos-report = "dbos_report.cli:main"

[tool.uv.sources]
pydantic-report = { workspace = true }

[build-system]
requires = ["uv_build==0.9.30"]
build-backend = "uv_build"
