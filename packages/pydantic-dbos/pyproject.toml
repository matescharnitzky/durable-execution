[project]
name = "dbos-report"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dbos[otel]>=3.5,<4",
    "logfire>=5,<6",
    "openai>=3.31,<4",
    "pydantic-ai-slim[dbos,openai]>=2.66,<3",
    "pydantic-settings>=2,<3",
    "rich>=15,<16",
    "typer>=0.16,<1",
    "weather-core",
]

[project.scripts]
dbos-report = "dbos_report.cli:app"

[tool.uv.sources]
weather-core = { workspace = true }

[build-system]
requires = [
    "uv_build==0.9.30",
]
build-backend = "uv_build"
