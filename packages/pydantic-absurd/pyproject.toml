[project]
name = "absurd-report"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "logfire>=5,<6",
    "openai>=3.31,<4",
    "pydantic-ai-slim[openai]>=2.68,<3",
    "pydantic-ai-harness[absurd]==0.68.0",
    "pydantic-settings>=2,<3",
    "rich>=15,<16",
    "typer>=0.16,<1",
    "weather-core",
]

[project.scripts]
absurd-report = "absurd_report.cli:app"

[tool.uv.sources]
weather-core = { workspace = true }

[build-system]
requires = [
    "uv_build==0.9.30",
]
build-backend = "uv_build"
