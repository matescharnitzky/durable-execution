[project]
site_name = "Durable execution lab"
site_description = "Compare recovery of agentic weather-report workflows"
repo_url = "https://github.com/matescharnitzky/durable-execution"
docs_dir = ".cache/docs"
site_dir = "site"
nav = [
  { "Overview" = "README.md" },
  { "Runtimes" = [
    { "LangGraph" = "packages/langgraph/README.md" },
    { "Pydantic AI + DBOS" = "packages/pydantic-dbos/README.md" },
    { "Pydantic AI + Temporal" = "packages/pydantic-temporal/README.md" },
    { "Pi Durable" = "packages/pi-durable/README.md" },
  ] },
]

[project.theme]
features = ["content.code.copy", "navigation.sections", "navigation.footer"]

[project.markdown_extensions]
admonition = {}
pymdownx.superfences = {}
